name: Build PIXLEGRAM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: chmod +x gradlew
      - run: ./gradlew :TMessagesProj_App:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PIXLEGRAM-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
