name: Build PIXLEGRAM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout PIXLEGRAM
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check source
        run: |
          test -f TMessagesProj_Modules/media/core_settings.gradle
          test -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle
          echo "Source check OK"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build PIXLEGRAM APK
        run: ./gradlew :TMessagesProj_App:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PIXLEGRAM-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
